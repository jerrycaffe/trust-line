spring:
  application:
    name: trustline


  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: false
    clean-disabled: false


jwt:
  signin:
    key: adeleyeTrustline
    secret: secret

firebase:
  config:
    location: firebase-location

email:
  sendgrid:
    api-key: sendgrid-api-key
  mailerSend:
    api-key: mailer-send