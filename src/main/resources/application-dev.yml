server:
  port: 8080
spring:
  application:
    name: trustline
  datasource:
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: create
        format_sql: true

jwt:
  signin:
    key: ${JWT_KEY}
    secret: ${JWT_SECRET}

firebase:
  config:
    location: ${FIREBASE_CONFIG_LOCATION}

email:
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
  mailerSend:
    api-key: ${MAIL_SENDER_API_KEY}
