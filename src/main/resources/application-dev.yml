server:
  port: ${PORT:8080}
spring:
  application:
    name: trustline

  datasource:
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: true

jwt:
  signin:
    key: ${JWT_KEY}
    secret: ${JWT_SECRET}

firebase:
  config:
    location: ${FIREBASE_CONFIG_LOCATION}

cloudinary:
  cloud-name: ddj3hjr57
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_SECRET}

email:
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
  mailerSend:
    api-key: ${MAIL_SENDER_API_KEY}
  resend:
    api-key: ${RESEND_API_KEY}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
